name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # 天地图 key 通过仓库 Secret 注入（可选）；未配置时前端自动回退政务灰底底图
      - name: Write map env
        run: |
          if [ -n "${{ secrets.VITE_TDT_KEY }}" ]; then
            printf 'VITE_TDT_KEY=%s\nVITE_TILE_PROVIDER=tdt\n' "${{ secrets.VITE_TDT_KEY }}" > .env.local
          fi
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
